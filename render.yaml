services:
  - type: web
    name: capex-roadmap
    env: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm install && npm run build:web
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20.11.0
